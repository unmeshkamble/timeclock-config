name: Sign config

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Config version (increase every time, e.g. 3)"
        required: true
      hr_number:
        description: "HR mobile, e.g. +919029090321"
        required: true
      backup_number:
        description: "Backup mobile, e.g. +919619615880"
        required: true
      sites:
        description: "Sites as ONE line of JSON. Use [] for none."
        required: true
        default: "[]"

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out config repo
        uses: actions/checkout@v5

      - name: Validate inputs and create signed config
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
          HR: ${{ inputs.hr_number }}
          BACKUP: ${{ inputs.backup_number }}
          SITES: ${{ inputs.sites }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo "SIGNING_KEY secret is missing"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "Version must be a whole number"; exit 1; }
          [[ "$HR" =~ ^\+91[0-9]{10}$ ]] || { echo "HR number must be +91 followed by 10 digits"; exit 1; }
          [[ "$BACKUP" =~ ^\+91[0-9]{10}$ ]] || { echo "Backup number must be +91 followed by 10 digits"; exit 1; }
          echo "$SITES" | jq -e 'type == "array" and all(.[]; (.name | type == "string") and (.prefix | type == "string") and ((.fence | length) >= 3))' >/dev/null \
            || { echo "Sites must be a JSON list. Each site needs name, prefix and at least 3 fence corners."; exit 1; }

          jq -n --argjson version "$VERSION" --arg hr "$HR" --arg backup "$BACKUP" --argjson sites "$SITES" \
            '{version: $version, hr_number: $hr, backup_number: $backup, sites: $sites}' > config.json

          printf '%s\n' "$SIGNING_KEY" > key.pem
          openssl dgst -sha256 -sign key.pem -out sig.bin config.json
          base64 -w0 sig.bin > config.sig
          rm -f key.pem sig.bin

          echo "Created config.json:"
          cat config.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add config.json config.sig
          git commit -m "Config version ${{ inputs.version }}"
          git push
